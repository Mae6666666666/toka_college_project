<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
     <header class="headers">
        <h1>
            ToKa
        </h1>
        <a href="non_membership_homepage.html">
            Home
        </a>
     </header>
     <h2>
        Settings
     </h2>
     <label for="audioSelection"></label>
     <select name="audioSelection" id="audioSelection">
        <option value="narrator-on">Narrator on</option>
        <option value="narrator-off" selected>Narrator off</option>
     </select>
     <label for="plans"></label>
     <select name="plans" id="plans">
        <option value="Premium">Premium</option>
        <option value="Beginer">Beginer</option>
        <option value="Free" selected>Free</option>
     </select>
     <label for="looks"></label>
     <select name="looks" id="looks">
        <option value="Dark">Dark</option>
        <option value="Light">Light</option>
        <option value="Auto" selected>Auto</option>
     </select>
     <label for="information"></label>
     <select name="plans" id="plans">
        <option value="information-placeholder" selected>Information</option>
        <option value="info">
            <p>
                This website is based off fitness. 
                ToKa aims to create an environment where staying
                fit and healthy is not a chore, and instead a joy
            </p>
        </option>
     </select>
     <button>
        <a href="login.html">Sign out</a>
     </button>
     <!-- if you have a membership plan already, this option will come up -->
     <button>
        <a href="membership_homepage.html">
            Go to membership page
        </a>
     </button>
</body>
</html>
